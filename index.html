<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EV Swap & Charging Rollout — Instamart Pods</title>
<style>
:root{
  --navy:#0b2545; --slate:#13315c; --bg:#f4f6fb; --card:#ffffff;
  --border:#e2e8f0; --text:#1a202c; --muted:#64748b; --muted2:#94a3b8;
  --green:#16a34a; --amber:#f59e0b; --red:#dc2626; --blue:#2563eb; --teal:#0d9488; --grey:#94a3b8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
header{background:linear-gradient(120deg,var(--navy),var(--slate));color:#fff;padding:14px 24px;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.12)}
header .row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
header h1{font-size:18px;font-weight:700;letter-spacing:.2px}
header .sub{font-size:12px;opacity:.8;margin-top:2px}
header .meta{display:flex;gap:14px;align-items:center;font-size:12px;flex-wrap:wrap}
header .meta .chip{background:rgba(255,255,255,.14);padding:4px 10px;border-radius:20px}
header .meta .btn{background:#fff;color:var(--navy);padding:6px 12px;border-radius:6px;border:0;font-weight:600;cursor:pointer;font-size:12px}
nav.tabs{display:flex;gap:2px;background:#fff;border-bottom:1px solid var(--border);padding:0 12px;position:sticky;top:55px;z-index:40;overflow-x:auto}
nav.tabs button{background:none;border:0;padding:12px 14px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button:hover{color:var(--navy);background:#f8fafc}
nav.tabs button.active{color:var(--navy);border-bottom-color:var(--blue)}
section.tab{display:none;padding:20px 24px 48px;max-width:1400px;margin:0 auto}
section.tab.active{display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.kpi .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.kpi .val{font-size:24px;font-weight:700;color:var(--navy);margin-top:3px}
.kpi .sub{font-size:11px;color:var(--muted);margin-top:2px}
.kpi .split{font-size:11px;margin-top:4px;display:flex;gap:8px}
.kpi .split .live{color:var(--green)} .kpi .split .upc{color:var(--blue)}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px}
.card h3{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.card h3 .sow{font-size:11px;font-weight:500;color:var(--muted);text-transform:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap}
.b-live{background:#dcfce7;color:#166534}.b-rollout_ready{background:#ccfbf1;color:#0f766e}
.b-in_progress{background:#dbeafe;color:#1e40af}.b-blocked_noc{background:#fef3c7;color:#92400e}
.b-blocked_vendor{background:#ffedd5;color:#9a3412}.b-not_feasible_power{background:#fee2e2;color:#991b1b}
.b-not_feasible_space{background:#fee2e2;color:#991b1b}.b-not_feasible_both{background:#fee2e2;color:#991b1b}
.b-not_assessed{background:#f1f5f9;color:#64748b}
.b-bangalore_over_40_pending{background:#fef9c3;color:#854d0e}.b-exceeds_max_load{background:#f3f4f6;color:#374151}
.b-within_headroom{background:#dcfce7;color:#166534}.b-tier2_additive{background:#dbeafe;color:#1e40af}
.b-tier2_bundled{background:#dbeafe;color:#1e40af}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--border);white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.3px;background:#f8fafc}
tbody tr:hover{background:#f8fafc}
.scroll{max-height:380px;overflow:auto;border:1px solid var(--border);border-radius:8px}
.tag{font-size:11px;padding:2px 7px;border-radius:6px;background:#eef2f7;color:var(--slate);font-weight:600}
.muted{color:var(--muted)} .small{font-size:11px}
.pos{color:var(--green)} .neg{color:var(--red)}
